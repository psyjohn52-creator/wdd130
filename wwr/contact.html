<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
      content="Have questions or need assistance? Contact us today. Our team is here to help you with any inquiries or support you may need. Get in touch now!">
    <meta name="author" content="John Eduardo Parra">
    <title>Contact Us Splash White Water Rafting</title>
    <link rel="stylesheet" href="styles/rafting.css">

</head>

<body>
    <header>
        <img src="images/z-splash.webp" alt="Rafting Site Logo">
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <h1 class="company">Splash White Water Rafting</h1>
        <div class="info">
            <p class="contact-data">Vicente Rocafuerte and Primera Constituyente</p>
            <p class="contact-data">Riobamba, Ecuador</p>
            <p class="contact-data">+593 990 919 292</p>
            <p class="contact-data">rafting_contact@whitewater.com</p>
        </div>
        <div class="container">
            <div class="map">
                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d13417.71682647141!2d-77.94877978456003!3d-1.078825539005212!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1ses!2sec!4v1771106547664!5m2!1ses!2sec"
                  width="600" height="450" allowfullscreen="" loading="lazy"
                  referrerpolicy="no-referrer-when-downgrade"></iframe>
            </div>
            <form>
                <fieldset>
                    <div class="form-item column2">
                        <label for="name">Name:</label>
                        <input type="text" id="name" name="name" required>
                    </div>
                    <div class="form-item column2">
                        <label for="email">Email:</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                </fieldset>
                <div class="purpose-selection">
                    <p>Message Purpose</p>
                    <div class="options">
                        <label><input type="radio" name="purpose" value="inquiry"> General
                            Inquiry</label>
                        <label><input type="radio" name="purpose" value="reservation">
                            Reservation Questions</label>
                        <label><input type="radio" name="purpose" value="suggestion"> Website
                            Suggestion</label>
                    </div>
                </div>
                <div class="message">
                    <label for="message">Message</label>
                    <textarea name="message" id="message" rows="4"></textarea>
                </div>
                <div class="form-item">
                    <label class="newsletter">
                        <input type="checkbox" name="subscribe" id="subscribe" checked>
                        Please subscribe me to the monthly newsletter
                    </label>
                </div>
                <button type="submit">Get in Touch!</button>
            </form>
        </div>
        <section>
            <h2>We are here to serve you</h2>
            <div class="employes">
                <figure>
                    <img src="images/elena.webp" alt="Elena Suarez Picture" width="140"
                      height="125">
                    <figcaption>Elena Suarez Portrait</figcaption>
                </figure>
                <figure>
                    <img src="images/frank.webp" alt="Frank Smith Picture" width="140" height="125">
                    <figcaption>Frank Smith Portrait</figcaption>
                </figure>
                <figure>
                    <img src="images/deez.webp" alt="Deez JohnsonPicture" width="140" height="125">
                    <figcaption>Deez Johnson Portrait</figcaption>
                </figure>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; | 2026 | Splash White Water Rafting | John Parra</p>
        <nav class="socialmedia">
            <a href="https://www.facebook.com/">
                <img src="images/facebook_1400843.webp" alt="Facebook Logo" width="100">
            </a>
            <a href="https://www.instagram.com/">
                <img src="images/instagram-logo_3983858.webp" alt="Instagram Logo" width="100">
            </a>
            <a href="https://www.linkedin.com/">
                <img src="images/logo_15713416.webp" alt="Linkedin Logo" width="100">
            </a>
        </nav>
    </footer>
</body>

</html>
